<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PromptShield AI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="container">

    <h1>🛡 PromptShield AI</h1>

    <p class="subtitle">
        AI Privacy Guard powered by Gemma
    </p>

    <textarea
        id="prompt"
        placeholder="Paste your prompt here..."
    ></textarea>

    <button onclick="analyzePrompt()">
        🛡 Shield My Prompt
    </button>

    <div id="loading" class="loading">
        Analyzing with Gemma...
    </div>

    <div id="result" class="hidden">

        <div class="card">

            <h2>Risk Level</h2>

            <p id="risk_level"></p>

        </div>

        <div class="card">

            <h2>Privacy Score</h2>

            <p id="privacy_score"></p>

        </div>

        <div class="card">

            <h2>Safe To Share?</h2>

            <p id="safe_to_share"></p>

        </div>

        <div class="card">

            <h2>Detected Items</h2>

            <ul id="detected_items"></ul>

        </div>

        <div class="card">

            <h2>Privacy Risks</h2>

            <ul id="privacy_risks"></ul>

        </div>

        <div class="card">

            <h2>Recommendations</h2>

            <ul id="recommendations"></ul>

        </div>

        <div class="card">

            <h2>Sanitized Prompt</h2>

            <textarea
                id="sanitized_prompt"
                readonly
            ></textarea>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
